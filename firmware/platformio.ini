; SIH26173 - LoRa Communication Extender
; Two ESP32-S3 + SX1262 nodes bridging two Android phones over LoRa.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Target hardware: Waveshare ESP32-S3 Mini (a.k.a. ESP32-S3-Zero)
; Chip: ESP32-S3FH4R2 -> 4 MB in-package flash + 2 MB in-package QUAD PSRAM
;
; PlatformIO has no Waveshare board definition. We use `lolin_s3_mini`
; because the WEMOS LOLIN S3 Mini carries the *same* ESP32-S3FH4R2 part:
; 4 MB flash, 2 MB quad PSRAM. See CLAUDE.md for why esp32-s3-devkitc-1
; (8 MB flash, no PSRAM) is the wrong choice here.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200

; Be explicit rather than inheriting: the flash size must match the real
; part or the partition table overruns the chip.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi   ; quad flash + quad PSRAM (R2)

build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1              ; USB-C is the only serial port
    -DARDUINO_USB_MODE=1

; Pinned to what actually resolved and built, so a future session gets the
; same toolchain rather than a silently newer major version.
lib_deps =
    jgromes/RadioLib@^7.7.1
    h2zero/NimBLE-Arduino@^2.5.1

; The bring-up sketch has its own setup()/loop(), so exactly one of the two
; entry points may be compiled per environment.
build_src_filter = +<*> -<bringup.cpp>

; ---------------------------------------------------------------------------
; Radio bring-up sketch. Flash this FIRST to prove the wiring, before any
; protocol or BLE code is in the picture:
;     pio run -e bringup -t upload && pio device monitor
; Identical board and radio settings; only the entry point differs.
; ---------------------------------------------------------------------------
[env:bringup]
extends = env:esp32s3
build_src_filter = +<*> -<main.cpp> -<link.cpp> -<codec_hook.cpp> -<ble_service.cpp>

; ---------------------------------------------------------------------------
; Native test target - protocol layer only, no Arduino/ESP-IDF anywhere.
; `src/` is excluded because main.cpp is Arduino code.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${common.build_flags}
    -std=c++17
    -O1
    -g
    ; Without these, Unity compiles TEST_ASSERT_DOUBLE_* down to no-ops and the
    ; airtime assertions would silently "pass" without ever being evaluated.
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-12
